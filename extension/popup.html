<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<style>
  body { width: 280px; margin: 0; font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; color:#0f1720; }
  .hd { background: linear-gradient(180deg,#1d4ed8,#1e3a8a); color:#fff; padding:12px 14px; }
  .hd .logo { font-weight:800; font-size:16px; }
  .hd .logo b { color:#bcd0ff; }
  .hd .s { font-size:11px; opacity:.9; margin-top:2px; }
  .bd { padding: 12px 14px; }
  .row { display:flex; justify-content:space-between; align-items:center; padding:5px 0; border-bottom:1px dashed #eef1f4; }
  .row .k { color:#6b7785; } .row input { width:80px; box-sizing:border-box; padding:5px 7px; border:1px solid #e7ebef; border-radius:7px; font:inherit; }
  h4 { margin:12px 0 6px; font-size:11px; text-transform:uppercase; letter-spacing:.3px; color:#1e3a8a; }
  button { width:100%; margin-top:10px; border:1px solid #e7ebef; background:#f5f7f9; font-weight:600; padding:8px; border-radius:9px; cursor:pointer; }
  button:hover { background:#eef1f4; }
  button.danger { background:#fff; border-color:#fca5a5; color:#b91c1c; }
  button.danger:hover { background:#fee2e2; }
  .empty { color:#9aa6b2; font-size:12px; }
  a { color:#1d4ed8; text-decoration:none; }
  .acc input { width:100%; box-sizing:border-box; margin:3px 0; padding:7px 8px; border:1px solid #e7ebef; border-radius:8px; font:inherit; }
  .acc .err { color:#c0392b; font-size:11.5px; min-height:14px; margin-top:2px; }
  .acc .who { display:flex; justify-content:space-between; align-items:center; }
  .plan { font-size:10.5px; font-weight:800; padding:2px 7px; border-radius:99px; background:#eef1f4; color:#6b7785; }
  .plan.pro { background:#1d4ed8; color:#fff; }
  .acc .btns { display:flex; gap:8px; } .acc .btns button { margin-top:8px; }
  .note { color:#9aa6b2; font-size:11px; margin-top:6px; }
</style>
</head>
<body>
  <div class="hd"><div class="logo">Load<b>Lens</b></div><div class="s">Скоринг грузов · DAT One / Truckstop</div></div>
  <div class="bd" id="settings"></div>
  <div class="bd" id="account"><div class="empty">Аккаунт…</div></div>
  <div class="bd" id="fleet"></div>
  <div class="bd" id="telegram"></div>
  <script src="vendor/scoring.js"></script>
  <script src="api.js"></script>
  <script src="hos.js"></script>
  <script src="drivers.js"></script>
  <script src="popup.js"></script>
</body>
</html>
